<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentor Matching</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a href="/" class="back-btn">⬅ Back to Home</a>
  <h1>👩‍🏫 Dropout Risk Predictor & Mentor Matching</h1>
  
  <form action="/predict" method="post" enctype="multipart/form-data">
    <p>Upload Students CSV:</p>
    <input type="file" name="file" required>
    <button type="submit">Upload & Predict</button>
  </form>

  <form action="/upload_mentors" method="post" enctype="multipart/form-data">
    <p>Upload Mentors CSV:</p>
    <input type="file" name="mentors_file" required>
    <button type="submit">Upload Mentors</button>
  </form>

  {% if message %}
    <p><strong>{{ message }}</strong></p>
  {% endif %}

  {% if table %}
    <div class="box">
      <h2>Results</h2>
      {{ table|safe }}
    </div>
  {% endif %}
</body>
</html>
